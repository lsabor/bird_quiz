{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bird Quiz{% endblock %}</title>
<style>
:root { --bg:#f7f6f2; --card:#fff; --fg:#1d2321; --muted:#66706b; --line:#dcdcd4; --accent:#2f6d4f;
        --ok:#2e7d32; --ok-bg:#e3f3e4; --bad:#c62828; --bad-bg:#fbe7e7; }
@media (prefers-color-scheme: dark) { :root { --bg:#141716; --card:#1d2120; --fg:#e7ebe8; --muted:#9aa5a0;
        --line:#323836; --accent:#6fbf93; --ok:#7fd483; --ok-bg:#1d3320; --bad:#f08a8a; --bad-bg:#3a1f1f; } }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
a { color:var(--accent) } header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center }
header a.brand { font-weight:700; text-decoration:none; color:var(--fg) } main { max-width:960px; margin:0 auto; padding:16px }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px }
.muted { color:var(--muted) } .small { font-size:13px } h1,h2 { margin:.2em 0 .5em }
button, .btn { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-block }
button.primary, .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px 20px }
fieldset { border:1px solid var(--line); border-radius:8px; margin:0; padding:8px 12px } legend { color:var(--muted); font-size:13px }
label { display:block; margin:2px 0 } input[type=number], select { font:inherit; padding:4px 6px; width:100%; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px }
.msg { padding:10px 14px; border-radius:8px; background:var(--bad-bg); color:var(--bad); margin-bottom:12px }
table { border-collapse:collapse; width:100% } td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><a class="brand" href="{% url 'quiz:setup' %}">🐦 Bird Quiz</a><a class="small" href="/admin/">admin</a></header>
<main>
{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
